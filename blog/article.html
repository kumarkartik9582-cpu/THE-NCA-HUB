<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#C9A84C">
<meta name="msapplication-TileColor" content="#C9A84C">
<title>The NCA Hub — Articles</title>
<meta name="robots" content="noindex, nofollow">
<script>
/**
 * article.html now exists only as a redirect bridge.
 * Old URL:  /blog/article.html?post=article-pass-nca-90-days
 * New URL:  /blog/article-pass-nca-90-days/
 *
 * Google will follow the redirect and index the new clean URL.
 * All old links shared on Reddit, email, etc. still work.
 */
(function () {
  var params = new URLSearchParams(window.location.search);
  var post   = params.get('post');

  if (post && /^[a-zA-Z0-9\-]+$/.test(post)) {
    // 301-equivalent in JS: replace so the back button skips this page
    window.location.replace('/blog/' + post + '/');
  } else {
    // No ?post= param — send to blog index
    window.location.replace('/blog/');
  }
})();
</script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
