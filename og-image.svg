<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#020204"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Gold accent line top -->
  <rect x="80" y="80" width="60" height="1" fill="#C9A84C"/>
  <!-- Eyebrow -->
  <text x="80" y="160" font-family="Georgia, serif" font-size="18" fill="#C9A84C" letter-spacing="6" font-weight="400">THE NCA HUB</text>
  <!-- Main headline -->
  <text x="80" y="280" font-family="Georgia, serif" font-size="72" fill="#EDE5CE" font-weight="300" letter-spacing="-2">Pass the NCA.</text>
  <text x="80" y="368" font-family="Georgia, serif" font-size="72" fill="#C9A84C" font-weight="300" letter-spacing="-2" font-style="italic">Strategically.</text>
  <!-- Subline -->
  <text x="80" y="460" font-family="Helvetica Neue, sans-serif" font-size="22" fill="#998E7C" font-weight="300" letter-spacing="1">Precision notes · Answer templates · Readiness scoring</text>
  <!-- Bottom rule -->
  <rect x="80" y="520" width="1040" height="1" fill="#C9A84C" fill-opacity="0.15"/>
  <!-- URL -->
  <text x="80" y="556" font-family="Helvetica Neue, sans-serif" font-size="16" fill="#6B6257" letter-spacing="2">thencahub.com</text>
  <!-- Corner accent -->
  <rect x="1100" y="80" width="1" height="80" fill="#C9A84C" fill-opacity="0.3"/>
  <rect x="1060" y="80" width="40" height="1" fill="#C9A84C" fill-opacity="0.3"/>
</svg>
